blueprint:
  name: Air quality light
  description: >
    Colors a light from green (good) through yellow (warning) to red (bad)
    based on CO₂, PM2.5 and/or VOC. Every sensor is optional: leave a field
    empty to ignore that indicator. If several indicators or sensors are
    set, the worst one decides the color. At night the light switches to a
    static, very dim warm white.
  domain: automation
  input:
    # ---------------------------------------------------------------
    # Devices: only the light and the night sensor are required
    # ---------------------------------------------------------------
    devices:
      name: Devices
      icon: mdi:devices
      input:
        co2_sensors:
          name: CO₂ sensor(s) (optional)
          description: Leave empty to ignore CO₂.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: carbon_dioxide
        pm_sensors:
          name: PM2.5 sensor(s) (optional)
          description: Leave empty to ignore PM2.5.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: pm25
        voc_sensors:
          name: VOC sensor(s) (optional)
          description: >
            Leave empty to ignore VOC. Defaults below assume the VOC index
            (0-500); adjust them if your sensor reports ppb or µg/m³.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
        light:
          name: Light
          selector:
            entity:
              filter:
                - domain: light
        night_sensor:
          name: Night mode sensor
          description: A binary sensor that is "on" at night.
          selector:
            entity:
              filter:
                - domain: binary_sensor

    # ---------------------------------------------------------------
    # Thresholds: green up to X, yellow at Y, red at Z (linear in between)
    # ---------------------------------------------------------------
    co2:
      name: CO₂ thresholds (ppm)
      icon: mdi:molecule-co2
      collapsed: true
      input:
        co2_green:
          name: Green up to
          default: 800
          selector:
            number: {min: 400, max: 3000, step: 50, mode: box, unit_of_measurement: ppm}
        co2_yellow:
          name: Yellow at
          default: 1000
          selector:
            number: {min: 400, max: 3000, step: 50, mode: box, unit_of_measurement: ppm}
        co2_red:
          name: Red at
          default: 1500
          selector:
            number: {min: 400, max: 3000, step: 50, mode: box, unit_of_measurement: ppm}
    pm:
      name: PM2.5 thresholds (µg/m³)
      icon: mdi:blur
      collapsed: true
      input:
        pm_green:
          name: Green up to
          default: 10
          selector:
            number: {min: 1, max: 150, step: 1, mode: box, unit_of_measurement: µg/m³}
        pm_yellow:
          name: Yellow at
          default: 25
          selector:
            number: {min: 1, max: 150, step: 1, mode: box, unit_of_measurement: µg/m³}
        pm_red:
          name: Red at
          default: 50
          selector:
            number: {min: 1, max: 150, step: 1, mode: box, unit_of_measurement: µg/m³}
    voc:
      name: VOC thresholds (index, 0-500)
      icon: mdi:molecule
      collapsed: true
      input:
        voc_green:
          name: Green up to
          default: 100
          selector:
            number: {min: 1, max: 5000, step: 10, mode: box}
        voc_yellow:
          name: Yellow at
          default: 200
          selector:
            number: {min: 1, max: 5000, step: 10, mode: box}
        voc_red:
          name: Red at
          default: 300
          selector:
            number: {min: 1, max: 5000, step: 10, mode: box}

    # ---------------------------------------------------------------
    # Look: hues are on the 0-360° color wheel (0 = red, 60 = yellow,
    # 120 = green, 240 = blue)
    # ---------------------------------------------------------------
    look:
      name: Colors and brightness
      icon: mdi:palette
      collapsed: true
      input:
        hue_green:
          name: Hue for green
          default: 120
          selector:
            number: {min: 0, max: 360, step: 5, mode: box}
        hue_yellow:
          name: Hue for yellow
          default: 60
          selector:
            number: {min: 0, max: 360, step: 5, mode: box}
        hue_red:
          name: Hue for red
          default: 0
          selector:
            number: {min: 0, max: 360, step: 5, mode: box}
        brightness_day:
          name: Day brightness
          default: 40
          selector:
            number: {min: 1, max: 100, step: 1, mode: slider, unit_of_measurement: "%"}
        brightness_night:
          name: Night brightness
          default: 1
          selector:
            number: {min: 1, max: 100, step: 1, mode: slider, unit_of_measurement: "%"}
        night_kelvin:
          name: Night color temperature
          default: 2000
          selector:
            number: {min: 2000, max: 4000, step: 100, mode: slider, unit_of_measurement: K}

# A new run cancels the previous one, so the light always follows the latest values
mode: restart

# Copy the inputs into variables so the templates below can use them
variables:
  co2_list: !input co2_sensors
  pm_list: !input pm_sensors
  voc_list: !input voc_sensors
  night_entity: !input night_sensor
  c_g: !input co2_green
  c_y: !input co2_yellow
  c_r: !input co2_red
  p_g: !input pm_green
  p_y: !input pm_yellow
  p_r: !input pm_red
  v_g: !input voc_green
  v_y: !input voc_yellow
  v_r: !input voc_red
  h_g: !input hue_green
  h_y: !input hue_yellow
  h_r: !input hue_red
  b_day: !input brightness_day
  b_night: !input brightness_night
  k_night: !input night_kelvin

triggers:
  # One trigger per indicator; an empty sensor list simply never fires
  - trigger: state
    entity_id: !input co2_sensors
  - trigger: state
    entity_id: !input pm_sensors
  - trigger: state
    entity_id: !input voc_sensors
  # Night mode switching on or off (id is used in the condition below)
  - trigger: state
    entity_id: !input night_sensor
    id: night_change

conditions:
  # During the night, ignore sensor updates (the light stays static).
  # Only react to the night mode sensor itself changing.
  - condition: template
    value_template: >
      {{ not is_state(night_entity, 'on')
         or (trigger is defined and trigger.id == 'night_change') }}

actions:
  - variables:
      # score: 0 = green, 1 = yellow, 2 = red (fractions in between)
      score: >
        {# Score of a single value from its three thresholds #}
        {% macro sc(v, g, y, r) -%}
          {%- if v <= g -%}0
          {%- elif v <= y -%}{{ (v - g) / (y - g) }}
          {%- elif v < r -%}{{ 1 + (v - y) / (r - y) }}
          {%- else -%}2{%- endif -%}
        {%- endmacro %}
        {# Worst score across a list of sensors; unavailable ones are skipped,
           an empty list gives 0 (= indicator ignored) #}
        {% macro worst(entities, g, y, r) -%}
          {%- set ns = namespace(m=0) -%}
          {%- for e in entities -%}
            {%- set v = states(e) | float(none) -%}
            {%- if v is not none -%}
              {%- set s = sc(v, g, y, r) | float(0) -%}
              {%- if s > ns.m %}{% set ns.m = s %}{% endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.m }}
        {%- endmacro %}
        {{ [
          worst(co2_list, c_g, c_y, c_r) | float(0),
          worst(pm_list, p_g, p_y, p_r) | float(0),
          worst(voc_list, v_g, v_y, v_r) | float(0)
        ] | max }}
      # Map the score to a hue: green -> yellow for 0..1, yellow -> red for 1..2
      hue: >
        {% set s = score | float(0) %}
        {{ (h_g + (h_y - h_g) * s if s <= 1 else h_y + (h_r - h_y) * (s - 1)) | round(0) }}
  - choose:
      # Night: static, very dim warm white
      - conditions:
          - condition: template
            value_template: "{{ is_state(night_entity, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              color_temp_kelvin: "{{ k_night | int }}"
              brightness_pct: "{{ b_night | int }}"
              transition: 5
    # Day: color from the air quality
    default:
      - action: light.turn_on
        target:
          entity_id: !input light
        data:
          hs_color: "{{ [hue | float(120), 100] }}"
          brightness_pct: "{{ b_day | int }}"
          transition: 5
